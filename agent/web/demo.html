<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Trace 大屏演示页</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            padding: 40px;
            margin: 0;
            background: #f8f9fa;
        }
        .title {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }
        .upload-area{
            font-size: 22px;
            padding: 20px;
            border: 2px dashed #666;
            text-align:center;
            margin-bottom:40px;
        }
        input[type="file"]{
            font-size:20px;
        }
        .chain-wrap {
            display: flex;
            gap: 24px;
            align-items: stretch;
            justify-content: center;
            flex-wrap: wrap;
        }
        .step-card {
            flex: 1;
            min-width: 260px;
            max-width: 320px;
            border: 3px solid #222;
            border-radius: 14px;
            padding: 24px;
            background:#fff;
        }
        .step-card.broken {
            border-color: #d63031;
            background-color: #fff2f2;
        }
        .step-index {
            font-weight: bold;
            font-size: 26px;
            margin-bottom: 16px;
            color: #0984e3;
        }
        .step-content {
            font-size: 20px;
            line-height: 1.7;
        }
        .evidence {
            background-color: #fff9c4;
            padding: 6px 10px;
            border-radius: 6px;
            display: inline;
        }
        .arrow {
            display: flex;
            align-items: center;
            font-size: 40px;
            color: #444;
        }
        .tip {
            margin-top:40px;
            text-align:center;
            font-size:20px;
            color:#555;
        }
    </style>
</head>
<body>
    <div class="title">推理决策链可视化 - 答辩大屏演示</div>
    <div class="upload-area">
        <label>选择 trace.json 文件：
            <input type="file" id="fileInput" accept=".json">
        </label>
        <span style="margin-left:12px">（载入trace.json自动渲染5步推理链路）</span>
    </div>
    <div id="container" class="chain-wrap"></div>
    <div class="tip">断链节点自动标红 | 适配1920×1080投影，字体≥20px</div>

    <script>
        // 和trace.html保持一致的字段映射，统一对接T1 schema
        const FIELD_MAP = {
            stepList: "step_list",
            stepText: "content",
            evidenceText: "evidence",
            isBroken: "is_broken",
            stepNo: "step_no"
        };
        const container = document.getElementById("container");
        const fileInput = document.getElementById("fileInput");

        fileInput.onchange = async function(e){
            const file = e.target.files[0];
            if(!file) return;
            const text = await file.text();
            const traceData = JSON.parse(text);
            renderTrace(traceData);
        }

        function renderTrace(traceData) {
            container.innerHTML = "";
            const steps = traceData[FIELD_MAP.stepList] || [];
            const showSteps = steps.slice(0, 5);

            showSteps.forEach((step, idx) => {
                const card = document.createElement("div");
                if (step[FIELD_MAP.isBroken] === true) {
                    card.classList.add("step-card", "broken");
                } else {
                    card.classList.add("step-card");
                }

                let contentHtml = escapeHtml(step[FIELD_MAP.stepText] || "无推理内容");
                const evidence = step[FIELD_MAP.evidenceText];
                if (evidence) {
                    contentHtml = contentHtml.replaceAll(escapeHtml(evidence), `<span class="evidence">${escapeHtml(evidence)}</span>`);
                }

                card.innerHTML = `
                    <div class="step-index">第${step[FIELD_MAP.stepNo] ?? (idx+1)}步</div>
                    <div class="step-content">${contentHtml}</div>
                `;
                container.appendChild(card);

                if (idx !== showSteps.length - 1) {
                    const arrow = document.createElement("div");
                    arrow.className = "arrow";
                    arrow.innerText = "→";
                    container.appendChild(arrow);
                }
            })
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
