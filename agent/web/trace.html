<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Trace 推理链路查看器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f4f7fa;
            padding: 24px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #222;
        }
        .upload-area {
            margin-bottom: 16px;
            font-size: 15px;
        }
        .warning-box {
            background: #fff8e6;
            border: 1px solid #ffd591;
            border-radius: 6px;
            padding: 12px 16px;
            color: #874d00;
            margin-bottom: 20px;
        }
        .summary-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }
        .summary-card h2 {
            font-size: 17px;
            margin-bottom: 12px;
            color: #333;
        }
        .summary-item {
            margin: 6px 0;
            font-size: 14.5px;
        }
        .unresolved-block {
            background: #fff2f2;
            border: 1px solid #ffccc7;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .unresolved-block h2 {
            font-size: 17px;
            color: #cf1322;
            margin-bottom:10px;
        }
        .unresolved-list {
            color: #cf1322;
            font-family: "Consolas", monospace;
            margin-bottom:12px;
        }
        .desc-list {
            font-size:14px;
            line-height:1.6;
            color:#444;
        }

        /* ===== 步骤卡片样式 ===== */
        .step-card {
            background: #ffffff;
            border-radius:8px;
            padding:16px;
            box-shadow:0 1px 4px rgba(0,0,0,0.08);
            margin-bottom:12px;
        }
        .step-title {
            font-weight:600;
            font-size:16px;
            margin-bottom:12px;
            padding-bottom:8px;
            border-bottom:1px solid #eaeaea;
            color:#222;
        }
        .step-section {
            margin-bottom:12px;
        }
        .step-label {
            font-size:14px;
            color:#555;
            margin-bottom:6px;
        }
        .step-json {
            background:#f7f9fc;
            border:1px solid #e5e9f2;
            border-radius:6px;
            padding:10px 12px;
            font-family: Consolas, monospace;
            font-size:13.5px;
            white-space:pre-wrap;
            word-break:break-all;
        }
        .step-row {
            font-size:14px;
            margin:8px 0;
        }
        .step-value {
            font-family: Consolas, monospace;
        }
        .evi-item {
            color:#222;
        }
        .evi-bad {
            color:#cf1322;
            text-decoration: underline;
            font-weight:600;
        }
        .evi-empty {
            color:#888;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Trace 推理链路查看器</h1>
    <div class="upload-area">
        加载Trace JSON文件：
        <input type="file" id="fileInput" accept=".json">
    </div>
    <div id="renderRoot"></div>
</div>

<script>
const root = document.getElementById('renderRoot');
const fileInput = document.getElementById('fileInput');

fileInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const txt = await file.text();
    const data = JSON.parse(txt);
    render(data);
}

function escapeHtml(str){
    if(str === null || str === undefined) return "—";
    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

function render(data) {
    root.innerHTML = '';
    const schema = data.schema || '';
    let warnHtml = '';

    if (schema === 'walking-skeleton/1') {
        warnHtml = `
        <div class="warning-box">
            ⚠️ 旧方言 walking‑skeleton/1，该格式无 unresolved 字段，不会执行断链红标。
            需要完整溯源字段请执行：<code>python tools/validate_trace.py xxx.json --migrate</code>迁移为 medpal‑trace/1
        </div>
        `
    }
    root.innerHTML += warnHtml;

    if (schema === 'medpal-trace/1') {
        const comp = data.trace_completeness ?? '-';
        const sources = Array.isArray(data.sources) ? data.sources : [];
        const gapsArr = Array.isArray(data.gaps) ? data.gaps : [];

        root.innerHTML += `
        <div class="summary-card">
            <h2>Trace 概要信息</h2>
            <div class="summary-item">trace_id: ${escapeHtml(data.trace_id ?? '')}</div>
            <div class="summary-item">用户问题: ${escapeHtml(data.question ?? '')}</div>
            <div class="summary-item">agent_version: ${escapeHtml(data.agent_version ?? '')}</div>
            <div class="summary-item">ontology_version: ${escapeHtml(data.ontology_version ?? '')}</div>
            <div class="summary-item">溯源完整率 trace_completeness: ${escapeHtml(comp)}</div>
            <div class="summary-item">sources: ${sources.length>0 ? sources.map(s=>escapeHtml(s)).join('、') : '无'}</div>
            <div class="summary-item">gaps: ${gapsArr.length>0 ? gapsArr.map(g=>escapeHtml(g)).join('；') : '无'}</div>
            <div class="summary-item" style="color:#666;font-size:13px;">提示: trace_completeness仅为汇总统计展示，不作为断链判定依据。</div>
        </div>
        `;

        const unresolvedArr = Array.isArray(data.unresolved) ? data.unresolved : [];
        const unresolvedText = unresolvedArr.length ? unresolvedArr.map(e=>escapeHtml(e)).join('; ') : '无';
        root.innerHTML += `
        <div class="unresolved-block">
            <h2>✕ Unresolved 解析失败的证据引用</h2>
            <div class="unresolved-list">${unresolvedText}</div>
            <div class="desc-list">
                说明：<br>
                1. trace_completeness=1.0 不代表每一步都带证据，拒答场景允许evidence为空数组；<br>
                2. unresolved非空≠整条推理不可信，仅命中的单条证据文字标红；<br>
                3. gaps仅为阅读文本，不参与任何断链判断。
            </div>
        </div>
        `
    } else {
        root.innerHTML += `
        <div class="summary-card">
            <h2>Trace 概要信息</h2>
            <div class="summary-item">schema: ${escapeHtml(schema)}</div>
            <div class="summary-item">asset_id: ${escapeHtml(data.asset?.asset_id ?? '-')}</div>
            <div class="summary-item" style="color:#666;">骨架方言，不支持unresolved/gaps/trace_completeness/sources字段</div>
        </div>
        `
    }

    const steps = Array.isArray(data.steps) ? data.steps : [];
    const unresolvedSet = new Set(Array.isArray(data.unresolved) ? data.unresolved : []);

    steps.forEach((step) => {
        let stepNo;
        if(schema === "medpal-trace/1"){
            stepNo = escapeHtml(step.i);
        }else{
            stepNo = escapeHtml(step.step);
        }
        const op = escapeHtml(step.op ?? '');
        const inVal = escapeHtml(JSON.stringify(step.in ?? [], null, 2));
        const outVal = escapeHtml(JSON.stringify(step.out ?? [], null, 2));
        const conf = step.confidence !== undefined ? Number(step.confidence).toFixed(3) : "—";
        const detailText = escapeHtml(step.detail ?? '');

        let evHtml = '';
        const evArr = Array.isArray(step.evidence) ? step.evidence : [];
        if (evArr.length === 0) {
            evHtml = `<span class="evi-empty">[无引用]</span>`;
        } else {
            evHtml = evArr.map(item => {
                const safeItem = escapeHtml(item);
                if (unresolvedSet.has(item)) {
                    return `<span class="evi-bad">${safeItem}</span>`;
                }
                return `<span class="evi-item">${safeItem}</span>`;
            }).join(' &nbsp;|&nbsp; ');
        }

        root.innerHTML += `
        <div class="step-card">
            <div class="step-title">Step ${stepNo}｜${op}</div>

            <div class="step-section">
                <div class="step-label">输入 in：</div>
                <pre class="step-json">${inVal}</pre>
            </div>

            <div class="step-section">
                <div class="step-label">输出 out：</div>
                <pre class="step-json">${outVal}</pre>
            </div>

            ${detailText ? `
            <div class="step-row">
                <span class="step-label">detail：</span>
                <span class="step-value">${detailText}</span>
            </div>
            ` : ''}

            <div class="step-row">
                <span class="step-label">confidence：</span>
                <span class="step-value">${escapeHtml(conf)}</span>
            </div>

            <div class="step-row">
                <span class="step-label">evidence：</span>
                <span class="step-value">${evHtml}</span>
            </div>
        </div>
        `;
    })
}
</script>
</body>
</html>
