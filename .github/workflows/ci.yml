name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: 代码规范检查（硬门槛）
        run: ruff check .

      - name: 领域层 import 白名单
        run: |
          if [ -d backend/domain ]; then
            ! grep -rnE "^\s*(import|from)\s+(django|requests|openai|dashscope|sqlalchemy|pymysql)" backend/domain/ \
              || (echo "领域层禁止引入框架与外部 SDK" && exit 1)
          fi

      - name: 异常吞没检查
        run: |
          ! grep -rn "except Exception:\s*pass" --include=*.py . \
            || (echo "禁止吞没异常" && exit 1)

      - name: 红线回归（禁用词）
        run: python tools/check_guard_words.py

      - name: 单元测试
        run: python -m pytest backend/tests -q --cov=backend/domain --cov-report=term-missing
        # 覆盖率门槛 W1 先不设：领域层还是空的，设了必然红。
        # W2 领域层开始写的第一天，加 --cov-fail-under=100
