name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Ruff Lint
        run: ruff check .

      - name: Ban except Exception:pass
        run: |
          if [ -d backend/domain ]; then
            ! grep -rnE "^\s*(import|from)\s+(django|requests|openai|dashscope|sqlalchemy|pymysql)" backend/domain/ \
              || (echo "领域层禁止引入框架与外部 SDK" && exit 1)
          fi

      - name: 异常吞没检查
        run: |
          python - <<END
import yaml
import os
forbidden_file = "./docs/forbidden_words.yaml"
if os.path.exists(forbidden_file):
  with open(forbidden_file,"r",encoding="utf-8") as f:
    data = yaml.safe_load(f)
    words = data.get("words",[])
    for w in words:
      res = os.popen(f'grep -r "{w}" --include="*.py" --include="*.md" .').read()
      if res:
        print(f"❌ 检测到禁用词: {w}")
        print(res)
        exit(1)
    print("✅ 禁用词检查通过")
else:
  print("⚠️ 禁用词文件还不存在，先跳过，后面我们再建forbidden_words.yaml")
END

      - name: Domain boundary check (placeholder)
        run: echo "领域边界校验脚本待补充"

      - name: Pytest & Coverage
        run: pytest --cov=. --cov-report=term
