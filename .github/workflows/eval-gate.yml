name: Evaluator Gate Check
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  eval-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run evaluator four-gate check
        run: python agent/tools/check_evaluator.py
