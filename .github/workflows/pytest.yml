name: pytest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: List test files
        run: ls -la agent/tests/

      - name: Test with pytest
        run: |
          pytest agent/tests/test_http_client.py agent/tests/test_mcp_client.py agent/tests/test_smoke.py --ignore=agent/tests/fixtures
