<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>院内智慧陪诊终端 · 给医院的方案演示</title>
<style>
  /* ==== 设计令牌 ==== */
  :root{
    --paper:#fbfaf7; --paper-2:#ffffff; --line:#e3ded4; --line-2:#d3ccbe;
    --ink:#16202c; --ink-2:#4d5a68; --ink-3:#8a949e;
    --teal:#0d6e63; --teal-soft:#e6f2f0; --teal-line:#b8d9d4;
    --amber:#b86b12; --amber-soft:#fbf1e2; --amber-line:#ecd3ac;
    --red:#b3261e; --red-soft:#fbeceb;
    --shadow:0 1px 2px rgba(22,32,44,.04),0 8px 24px -12px rgba(22,32,44,.14);
    --shadow-lg:0 2px 4px rgba(22,32,44,.05),0 24px 48px -20px rgba(22,32,44,.24);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 12% -10%, #eef3f2 0%, transparent 62%),
      radial-gradient(700px 420px at 96% 4%, #fbf0e0 0%, transparent 58%),
      var(--paper);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-size:15px; line-height:1.6; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif}

  /* ==== 页头 ==== */
  header.top{
    position:sticky; top:0; z-index:40;
    background:rgba(251,250,247,.86); backdrop-filter:blur(10px) saturate(1.2);
    border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:1400px; margin:0 auto; padding:14px 26px; display:flex; align-items:center; gap:22px; flex-wrap:wrap}
  .brand{display:flex; align-items:baseline; gap:12px; min-width:0}
  .brand h1{margin:0; font-size:19px; letter-spacing:.06em; font-weight:700}
  .brand .sub{font-size:12.5px; color:var(--ink-3); letter-spacing:.1em; white-space:nowrap}
  .badge{
    font-size:11.5px; letter-spacing:.08em; color:var(--teal);
    border:1px solid var(--teal-line); background:var(--teal-soft);
    border-radius:999px; padding:3px 11px; white-space:nowrap;
  }
  /* 步骤轨道 */
  .rail{display:flex; align-items:center; gap:6px; margin-left:auto; flex-wrap:wrap}
  .rail button{
    font:inherit; font-size:12px; color:var(--ink-3); background:transparent;
    border:1px solid transparent; border-radius:8px; padding:5px 9px; cursor:pointer;
    transition:.16s; white-space:nowrap;
  }
  .rail button:hover{color:var(--ink); background:#f0ede6}
  .rail button.on{color:#fff; background:var(--teal); border-color:var(--teal)}
  .rail .sep{width:1px; height:16px; background:var(--line-2); margin:0 3px}

  /* ==== 主区 ==== */
  main{max-width:1400px; margin:0 auto; padding:26px 26px 104px;
    display:grid; grid-template-columns:minmax(0,1fr) 460px; gap:34px;
    align-items:center; align-content:center; min-height:calc(100vh - 108px)}
  main.doc-mode{grid-template-columns:minmax(0,1fr); max-width:940px;
    align-items:start; align-content:safe center; min-height:calc(100vh - 108px);
    padding-top:26px; padding-bottom:96px}
  main.doc-mode aside{display:none}
  main.doc-mode .doc{max-width:940px}
  @media (max-width:1120px){ main{grid-template-columns:1fr; gap:26px} }

  /* ==== 舞台（设备）==== */
  .stage{display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:6px}
  .stage-note{font-size:12.5px; color:var(--ink-3); letter-spacing:.05em}

  .device{
    width:100%; max-width:400px;
    background:linear-gradient(180deg,#f2f5f8 0%,#dbe2ea 62%,#c9d2dd 100%);
    border-radius:34px; padding:16px 16px 22px;
    box-shadow:var(--shadow-lg), inset 0 1px 0 #fff;
    position:relative;
  }
  .device::before{
    content:""; position:absolute; inset:7px; border-radius:28px;
    border:1px solid rgba(255,255,255,.7); pointer-events:none;
  }
  .plate{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 4px 10px; font-size:10.5px; letter-spacing:.09em; color:#5a6672; font-weight:700;
  }
  .plate .live{display:flex; align-items:center; gap:5px; color:#3c7d5f}
  .plate .dot{width:6px; height:6px; border-radius:50%; background:#37a06f; box-shadow:0 0 0 3px rgba(55,160,111,.16)}
  .plate .dot.off{background:#98a3ad; box-shadow:none}

  /* 屏幕 */
  .screen{
    background:#000; border-radius:16px; border:5px solid #232b35;
    min-height:470px; padding:16px 15px 12px;
    display:flex; flex-direction:column; gap:9px;
    --fg:#ffe600; --bar:#ffe600; --barfg:#000;
    box-shadow:inset 0 0 0 1px #000, 0 6px 18px -8px rgba(0,0,0,.6);
    position:relative; overflow:hidden;
  }
  .screen.white{--fg:#fff; --bar:#fff}
  .screen .s-title{font-size:18px; font-weight:900; color:var(--fg); letter-spacing:.02em; line-height:1.3; border-bottom:2px solid var(--fg); padding-bottom:7px}
  .screen .s-body{flex:1; display:flex; flex-direction:column; justify-content:center; gap:7px; font-size:20px; line-height:1.48; color:var(--fg); font-weight:700; word-break:break-word}
  .screen .s-body.small{font-size:16.5px}
  .screen .s-body .kv{display:flex; gap:8px; font-size:17px; align-items:baseline}
  .screen .s-body .kv i{font-style:normal; opacity:.66; min-width:88px; font-weight:700; white-space:nowrap}
  .screen .s-body b{color:#fff}
  .screen .s-body .warnline{color:#ff8a65}
  .screen .s-opts{display:flex; flex-wrap:wrap; gap:6px}
  .screen .chip{
    font-size:13.5px; font-weight:800; padding:7px 12px; border-radius:999px;
    border:2px solid var(--fg); color:var(--fg); background:transparent; cursor:pointer;
    font-family:inherit; transition:.12s;
  }
  .screen .chip:hover{background:rgba(255,230,0,.14)}
  .screen .s-primary{
    width:100%; min-height:58px; border-radius:12px; border:none; cursor:pointer;
    background:#3f9be0; color:#04121f; font-family:inherit; font-size:17px; font-weight:900;
    letter-spacing:.04em; box-shadow:0 4px 0 #2a7ab8; transition:.1s; margin-top:2px;
  }
  .screen .s-primary:hover{background:#57abec}
  .screen .s-primary:active{transform:translateY(2px); box-shadow:0 2px 0 #2a7ab8}
  .screen .s-primary[disabled]{opacity:.4; cursor:default}
  .screen .s-comfort{
    display:none; background:#3a2410; border:1px solid #b07a2e; border-radius:9px;
    padding:7px 9px; font-size:13px; font-weight:800; color:#ffd8a8; line-height:1.45;
  }
  .screen .s-comfort.on{display:block}
  .screen .s-cap{
    background:var(--bar); color:var(--barfg); border-radius:7px; padding:6px 9px;
    font-size:12.5px; font-weight:800; min-height:30px; display:flex; align-items:center;
  }

  /* 底栏四控件 */
  .dock{display:grid; grid-template-columns:1.75fr 1fr 1fr 1.2fr; gap:7px; margin-top:2px}
  .dock .k{
    border:none; border-radius:11px; min-height:56px; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:11px; font-weight:900; letter-spacing:.02em; color:#101820;
    background:linear-gradient(180deg,#f7fafc,#c8d2de); box-shadow:0 3px 0 #9dabbc;
    transition:.1s; line-height:1.2;
  }
  .dock .k:active{transform:translateY(2px); box-shadow:0 1px 0 #9dabbc}
  .dock .k .ico{font-size:15px}
  .dock .k.mic{background:linear-gradient(180deg,#4cc98a,#1f8f5b); color:#04170e; box-shadow:0 3px 0 #16704a}
  .dock .k.sos{background:linear-gradient(180deg,#e5484d,#a9171c); color:#fff; box-shadow:0 3px 0 #7d1015}
  .screen-foot{display:flex; justify-content:space-between; padding:8px 5px 0; font-size:9.5px; color:#5f6a76; font-weight:700; letter-spacing:.06em}

  /* 家属手机 */
  .phone{
    width:270px; background:#0f151c; border-radius:22px; padding:9px;
    box-shadow:var(--shadow-lg); align-self:center;
  }
  .phone .notch{width:56px; height:4px; border-radius:99px; background:#2b343d; margin:2px auto 8px}
  .phone .ph-screen{background:#f4f5f7; border-radius:14px; padding:11px; min-height:300px; display:flex; flex-direction:column; gap:9px}
  .ph-head{display:flex; align-items:center; gap:7px; font-size:11.5px; color:#5d6874; font-weight:700}
  .ph-head .avatar{width:19px; height:19px; border-radius:5px; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800}
  .ph-msg{background:#fff; border-radius:9px; padding:10px; font-size:12.5px; line-height:1.65; color:#1e2833; box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .ph-msg b{color:var(--teal)}
  .ph-msg .h{font-weight:800; font-size:12px; margin-bottom:5px; color:#0f1720}
  .ph-msg ul{margin:6px 0 0; padding-left:16px}
  .ph-msg li{margin:2px 0}
  .ph-foot{font-size:10.5px; color:#98a2ad; text-align:center; margin-top:auto}

  /* ==== 右侧解说 ==== */
  aside{position:sticky; top:88px; display:flex; flex-direction:column; gap:16px}
  @media (max-width:1120px){ aside{position:static} }

  .narr{
    background:var(--paper-2); border:1px solid var(--line); border-radius:16px;
    padding:22px 22px 20px; box-shadow:var(--shadow);
  }
  .narr .eyebrow{
    display:flex; align-items:center; gap:9px; font-size:11.5px; letter-spacing:.14em;
    color:var(--ink-3); font-weight:700; margin-bottom:11px;
  }
  .narr .eyebrow .num{
    width:23px; height:23px; border-radius:6px; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; letter-spacing:0;
  }
  .narr h2{margin:0 0 6px; font-size:24px; line-height:1.34; letter-spacing:.01em; font-weight:700}
  .narr .lede{margin:0 0 16px; font-size:14px; color:var(--ink-2); line-height:1.7}

  .dl{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line)}
  .dl .row{display:grid; grid-template-columns:78px 1fr; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); align-items:start}
  .dl .row:last-child{border-bottom:none}
  .dl dt{font-size:12px; color:var(--ink-3); letter-spacing:.06em; font-weight:700; padding-top:1px}
  .dl dd{margin:0; font-size:13.5px; color:var(--ink); line-height:1.66}
  .dl dd em{font-style:normal; color:var(--teal); font-weight:700}

  .callout{
    background:var(--amber-soft); border:1px solid var(--amber-line); border-left:3px solid var(--amber);
    border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.66; color:#6d4410; margin-top:14px;
  }
  .callout b{color:#8a4f0c}

  /* 文档型视图 */
  .doc{background:var(--paper-2); border:1px solid var(--line); border-radius:18px; padding:34px 38px; box-shadow:var(--shadow); max-width:760px; margin:0 auto}
  .doc h2{margin:0 0 4px; font-size:27px; letter-spacing:.01em}
  .doc .lede{margin:0 0 24px; color:var(--ink-2); font-size:14.5px}
  .doc h3{margin:26px 0 10px; font-size:16px; letter-spacing:.04em; color:var(--teal); display:flex; align-items:center; gap:8px}
  .doc h3::before{content:""; width:3px; height:15px; background:var(--teal); border-radius:2px}
  .doc table{width:100%; border-collapse:collapse; font-size:13.5px; margin:6px 0 4px}
  .doc th{text-align:left; font-weight:700; color:var(--ink-3); font-size:11.5px; letter-spacing:.1em; padding:7px 10px 7px 0; border-bottom:1px solid var(--line-2)}
  .doc td{padding:9px 10px 9px 0; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.6}
  .doc tr:last-child td{border-bottom:none}
  .doc .tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:5px; background:var(--teal-soft); color:var(--teal); font-weight:700; letter-spacing:.04em}
  .doc .tag.no{background:var(--red-soft); color:var(--red)}
  .doc ul{margin:8px 0; padding-left:20px; font-size:13.5px; line-height:1.8}
  .doc .kvline{display:grid; grid-template-columns:120px 1fr; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px}
  .doc .kvline:last-child{border:none}
  .doc .kvline .k{color:var(--ink-3); font-size:12px; letter-spacing:.05em; font-weight:700; padding-top:2px}

  /* ==== 底部导航 ==== */
  .footbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:rgba(251,250,247,.9); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding:12px 26px;
  }
  .foot-inner{max-width:1400px; margin:0 auto; display:flex; align-items:center; gap:16px}
  .foot-inner .pos{font-size:12.5px; color:var(--ink-3); letter-spacing:.08em; font-variant-numeric:tabular-nums}
  .foot-inner .pos b{color:var(--ink); font-size:14px}
  .btn{
    font:inherit; font-size:13.5px; font-weight:700; letter-spacing:.02em;
    border-radius:10px; padding:10px 20px; cursor:pointer; transition:.15s;
    border:1px solid var(--line-2); background:var(--paper-2); color:var(--ink);
  }
  .btn:hover{background:#f2efe8; border-color:#c2b9a8}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:#fff; box-shadow:0 2px 0 #095249}
  .btn.primary:hover{background:#0f7d70}
  .btn:disabled{opacity:.35; cursor:default}
  .foot-inner .spacer{flex:1}

  /* 提示 */
  .hint{font-size:12px; color:var(--ink-3); display:flex; align-items:center; gap:6px}
  .kbd{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px; background:#efebe3; border:1px solid var(--line-2); border-bottom-width:2px; border-radius:4px; padding:1px 5px; color:var(--ink-2)}

  /* 动效 */
  @keyframes fadeUp{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
  .fade{animation:fadeUp .3s cubic-bezier(.2,.7,.3,1) both}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1 class="serif">院内智慧陪诊终端</h1>
      <span class="sub">建设方案演示 · 面向医院</span>
    </div>
    <span class="badge">教学项目 · 不收费</span>
    <nav class="rail" id="rail"></nav>
  </div>
</header>

<main>
  <!-- 左：设备舞台 -->
  <section class="stage" id="stage"></section>

  <!-- 右：解说 -->
  <aside id="aside"></aside>
</main>

<div class="footbar">
  <div class="foot-inner">
    <button class="btn" id="prev">← 上一步</button>
    <span class="pos" id="pos"></span>
    <div class="spacer"></div>
    <span class="hint"><span class="kbd">←</span><span class="kbd">→</span> 键也可以翻页</span>
    <button class="btn primary" id="next">下一步 →</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   静态数据（与设备端原型一致，医院看到的每个字都是真机上会出现的）
   ========================================================= */
var SPOTS = {
  hall:{name:'门诊大厅', beacon:'B-01', tip:'门诊大厅，是您就诊的第一站。这里可以挂号、缴费、取号，也可以向服务台工作人员求助。'},
  reg:{name:'挂号收费处', beacon:'B-02', tip:'挂号收费处，可以现场挂号、缴费和打印发票。窗口设有低位柜台，方便轮椅使用者。'},
  im:{name:'内科诊区', beacon:'B-03', tip:'内科诊区，包含心血管内科、呼吸内科和消化内科诊室。请在候诊区就坐，听到叫号后再进入诊室。'},
  lab:{name:'检验科采血窗口', beacon:'B-05', tip:'检验科采血窗口，抽血前请先取号，抽血后请按压针眼五分钟。'},
  pharm:{name:'门诊药房', beacon:'B-07', tip:'门诊药房，取药请出示取药单，药师会当面交代用法用量。'}
};

var DEPTS = {
  '心血管内科':{room:'门诊楼 2 层 A 区 208 诊室', wait:'约 15 分钟', intro:'主要诊治高血压、冠心病、心律失常等疾病。'},
  '呼吸内科':{room:'门诊楼 2 层 A 区 212 诊室', wait:'约 20 分钟', intro:'主要诊治咳嗽、哮喘、肺部感染等疾病。'},
  '消化内科':{room:'门诊楼 2 层 B 区 216 诊室', wait:'约 20 分钟', intro:'主要诊治胃痛、反酸、腹泻等。'},
  '神经内科':{room:'门诊楼 3 层 A 区 305 诊室', wait:'约 25 分钟', intro:'主要诊治头痛、头晕、脑血管病等。'},
  '骨科':{room:'门诊楼 1 层 C 区 118 诊室', wait:'约 15 分钟', intro:'主要诊治骨折、关节疼痛、颈腰椎疾病等。'},
  '急诊科':{room:'门诊楼 1 层 急诊区 E100', wait:'立即接诊', intro:'急诊科，24 小时开放，危重情况请立即前往。'}
};

var NAV = ['从门诊大厅出发，向前走约 20 米','右手边是无障碍电梯，乘到 2 层','出电梯左转，前方 3 米有台阶，右侧设缓坡与扶手','沿走廊直行，左手边经过饮水处','到达心血管内科分诊台，208 诊室在右手边'];

/* =========================================================
   每一幕的解说词
   ========================================================= */
var VIEWS = [
  {
    id:'open', kind:'doc', nav:'为什么做',
    title:'每天有一批患者，能自己走，但走不明白',
    lede:'他们不识字、看不清字、不会用自助机、听不懂叫号、找不到科室、记不住医嘱。有家属，但家属在上班、在外地。',
    body:function(){ return `
      <h3>现在的三种办法，各有各的缺口</h3>
      <table>
        <tr><th style="width:130px">现有办法</th><th>缺口</th></tr>
        <tr><td><b>导医台问路</b></td><td>只能指路，管不了挂号、检查、取药、医嘱这一整条链；高峰期一个人答不过来</td></tr>
        <tr><td><b>志愿者陪走</b></td><td>人力有限，一个人同一时间只能陪一个人；排班、培训、管理都要投入</td></tr>
        <tr><td><b>家属请假陪同</b></td><td>请一天假少一天工资；家属不在本地的根本来不了</td></tr>
      </table>

      <h3>我们的思路</h3>
      <p style="font-size:15.5px;line-height:1.8;margin:6px 0 0">
        不增加人手，而是把「陪着一个老人走完全程」这件事，<b>做成一台放在门诊大厅的设备</b>。<br>
        老人不用学、不用打字、不用手机，从进院到离院全程有人「陪着说话」；家属在手机上远程看见进度与医嘱。
      </p>

      <h3>它做四件事</h3>
      <ul>
        <li>告诉老人<b>下一步去哪、做什么、等多久</b></li>
        <li>把医生说的话<b>原样记住</b>，再慢慢讲一遍</li>
        <li>在老人紧张、等待、找不到路时，<b>先安抚，再办事</b></li>
        <li>出问题时，<b>第一时间叫到人</b></li>
      </ul>
      <p style="font-size:13px;color:#8a949e;margin-top:18px">它不做医疗判断，不给用药建议，不替代医生。</p>
    `; }
  },

  {
    id:'arrive', nav:'① 抵达建档',
    title:'把身份证放上去，就算到了',
    lede:'老人不用注册账号、不用扫码、不用记密码。放一下身份证，屏幕上就出现他自己的名字。',
    phone:null,
    dl:[

/* =========================================================
   状态
   ========================================================= */
var S = {
  i:0,
  on:false,
  spot:'hall',
  reg:{dept:'心血管内科', no:'A012', seq:5},
  comfort:'',
  sos:false
};

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* =========================================================
   设备屏幕渲染
   ========================================================= */
function screen(title, bodyHtml, opts, primary, small){
  var optHtml = (opts||[]).map(function(o){
    return '<button class="chip" data-act="'+esc(o.act||'')+'">'+esc(o.label)+'</button>';
  }).join('');
  var primHtml = primary
    ? '<button class="s-primary" data-act="'+esc(primary.act||'next')+'">'+esc(primary.label)+'</button>'
    : '';
  return ''
    + '<div class="screen'+(S.on?'':' white')+'">'
    +   '<div class="s-title">'+title+'</div>'
    +   '<div class="s-body'+(small?' small':'')+'">'+bodyHtml+'</div>'
    +   (S.comfort ? '<div class="s-comfort on">🧡 陪伴：'+esc(S.comfort)+'</div>' : '<div class="s-comfort"></div>')
    +   (optHtml ? '<div class="s-opts">'+optHtml+'</div>' : '')
    +   primHtml
    +   '<div class="s-cap">'+capFor()+'</div>'
    + '</div>'
    + '<div class="dock">'
    +   '<button class="k mic" data-act="mic"><span class="ico">🎤</span><span>按住说话</span></button>'
    +   '<button class="k" data-act="back"><span class="ico">←</span><span>返回</span></button>'
    +   '<button class="k" data-act="menu"><span class="ico">☰</span><span>主菜单</span></button>'
    +   '<button class="k sos" data-act="sos"><span class="ico">🔴</span><span>求助</span></button>'
    + '</div>'
    + '<div class="screen-foot"><span>10.1 寸触摸屏 · 语音同步</span><span>'+nowHM()+'</span></div>';
}

function capFor(){
  var v = VIEWS[S.i];
  if(v.id === 'arrive' && !S.on) return '（待机中 · 点一下屏幕就能开始）';
  var map = {
    arrive:'您好，我是您的陪诊助手，今天由我陪着您。',
    triage:'请说出您哪里不舒服，比如说「我胸闷」。',
    register:'请确认科室和诊室，确认后我就帮您挂上。',
    waiting:'您的号我盯着，快叫到您的时候我会提醒。',
    guide:'这里是内科诊区，请在候诊区就坐，听到叫号再进诊室。',
    nav:'出电梯往左，前方有台阶，右侧有缓坡和扶手。',
    recap:'氨氯地平片 5 毫克，每天一次，早上吃，共 14 天。',
    pay:'总共 386 元，医保出 253 元，您自己掏 133 元。',
    home:'本地缓存已全部清空，请把设备归还服务台。'
  };
  return map[v.id] || '（字幕区：与语音同步显示的高对比度大字）';
}
function nowHM(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

/* 各幕对应的设备画面 */
function deviceFor(){
  var v = VIEWS[S.i];
  if(S.sos){
    return screen('一键求助已发送',
      '<div><b>已通知医院服务台</b></div>'
      + '<div>位置：'+SPOTS[S.spot].name+'</div>'
      + '<div>时间：'+nowHM()+'</div>'
      + '<div style="margin-top:4px">请留在原地，工作人员正在赶来。</div>',
      [{label:'我知道了', act:'sosOff'}], null, true);
  }

  switch(v.id){
    case 'arrive':
      return screen(S.on ? '欢迎使用' : '待机中',
        S.on
          ? '<div>您好，我是您的陪诊助手。</div><div>今天由我陪着您，有事慢慢说就行。</div><div>本设备仅限院内使用，离院请归还服务台。</div>'
          : '<div>点一下屏幕就能开始。</div><div style="opacity:.75;font-size:16px">不用扫码，不用打字，也不用装 App。</div>',
        S.on ? [{label:'刷身份证 · 首次建档', act:'id'}, {label:'人脸识别', act:'face'}] : [],
        S.on ? null : {label:'触摸屏幕开始', act:'on'},
        false);

    case 'triage':
      return screen('哪里不舒服',
        '<div>请按住下面的绿色话筒，说您哪里不舒服。</div><div style="opacity:.75;font-size:16px">也可以直接点下面的例子。</div>',
        [{label:'我胸闷', act:'symptom'}, {label:'头晕', act:'symptom'}, {label:'胃疼', act:'symptom'}, {label:'咳嗽', act:'symptom'}],
        null, false);

    case 'register':{
      var d = DEPTS[S.reg.dept];
      return screen('确认挂号',
        '<div>即将为您预约：<b>'+S.reg.dept+'</b></div>'
        + '<div>诊室：'+d.room+'</div>'
        + '<div>预计等待：'+d.wait+'</div>'
        + '<div style="opacity:.75;font-size:16px;margin-top:2px">重要操作需要再确认一次，防止点错。</div>',
        [{label:'换一个科室', act:'none'}],
        {label:'确认挂号', act:'next'}, true);
    }

    case 'waiting':
      return screen('候诊中 · 我帮您看着号',
        '<div class="kv"><i>您的号码</i><span>第 12 位</span></div>'
        + '<div class="kv"><i>当前叫到</i><span>第 8 位</span></div>'
        + '<div class="kv"><i>预计等待</i><span>约 15 分钟</span></div>',
        [{label:'我去洗手间', act:'none'}, {label:'我不舒服', act:'sos'}],
        null, true);

    case 'guide':
      return screen('当前位置讲解',
        '<div>当前位置：<b>'+SPOTS[S.spot].name+'</b></div>'
        + '<div style="opacity:.7;font-size:15px">（已识别到您走到这里，自动播报）</div>'
        + '<div style="margin-top:3px">'+SPOTS[S.spot].tip+'</div>',
        [{label:'去内科诊区', act:'spotIm'}, {label:'去药房', act:'spotPharm'}],
        null, true);

    case 'nav':
      return screen('前往 心血管内科',
        '<div>目的地：<b>心血管内科</b></div>'
        + '<div style="opacity:.75;font-size:16px">第 2 / 5 步</div>'
        + '<div>'+NAV[1]+'</div>',
        [{label:'再讲一遍', act:'none'}, {label:'我找不到', act:'sos'}],
        {label:'我到了', act:'next'}, true);

    case 'recap':
      return screen('我重复一遍，您听听对不对',
        '<div style="font-size:17px">医生开的药：</div>'
        + '<div>① 苯磺酸氨氯地平片 5 毫克</div>'
        + '<div style="font-size:16px;opacity:.85">每日 1 次 · 晨服 · 共 14 天</div>'
        + '<div>② 阿司匹林肠溶片 100 毫克</div>'
        + '<div style="font-size:16px;opacity:.85">每日 1 次 · 睡前服 · 共 14 天</div>',
        [{label:'不太对，再说一遍', act:'none'}, {label:'念给我听', act:'none'}],
        {label:'对，记住了', act:'next'}, false);

    case 'pay':
      return screen('缴费 · 取药',
        '<div class="kv"><i>总共</i><span>386 元</span></div>'
        + '<div class="kv"><i>医保出</i><span>253 元</span></div>'
        + '<div class="kv"><i>自己掏</i><span>133 元</span></div>'
        + '<div style="font-size:16px;opacity:.85;margin-top:4px">取药窗口：1 楼 门诊药房 3 号窗口</div>',
        [{label:'这钱怎么算的', act:'none'}],
        {label:'去取药', act:'next'}, true);

    case 'home':
      return screen('归还设备 · 缓存已清空',
        '<div>本地缓存已全部清除。</div>'
        + '<div>身份证、人脸模板、病历临时文件：<b>已删除</b>。</div>'
        + '<div style="margin-top:4px">感谢使用，请将设备归还服务台。</div>',
        [], {label:'返回待机', act:'reset'}, true);

    default:
      return screen('欢迎使用',
        '<div>您好，我是您的陪诊助手。</div><div>今天由我陪着您，有事慢慢说就行。</div>',
        [], {label:'开始', act:'next'}, false);
  }
}

/* =========================================================
   右侧解说
   ========================================================= */
function narrFor(){
  var v = VIEWS[S.i];
  var num = VIEWS.filter(function(x){ return !x.kind; }).indexOf(v) + 1;
  var head = v.kind
    ? '<div class="eyebrow"><span>附录</span></div>'
    : '<div class="eyebrow"><span class="num">'+num+'</span><span>第 '+num+' 步 / 共 9 步</span></div>';
  var dl = (v.dl||[]).map(function(r){
    return '<div class="row"><dt>'+esc(r[0])+'</dt><dd>'+r[1]+'</dd></div>';
  }).join('');
  return '<div class="narr fade">'
    + head
    + '<h2 class="serif">'+esc(v.title)+'</h2>'
    + '<p class="lede">'+esc(v.lede)+'</p>'
    + (dl ? '<dl class="dl">'+dl+'</dl>' : '')
    + (v.callout ? '<div class="callout">'+v.callout+'</div>' : '')
    + '</div>';
}

function phoneFor(){
  var v = VIEWS[S.i];
  if(!v.phone) return '';
  return '<div class="phone fade">'
    + '<div class="notch"></div>'
    + '<div class="ph-screen">'
    +   '<div class="ph-head"><span class="avatar">陪</span>智慧陪诊 · 家属端</div>'
    +   '<div class="ph-msg"><div class="h">'+v.phone.h+'</div>'+v.phone.body+'</div>'
    +   '<div class="ph-foot">演示界面 · 不采集真实信息</div>'
    + '</div></div>';
}

/* =========================================================
   渲染
   ========================================================= */
function render(){
  var v = VIEWS[S.i];

  /* 轨道 */
  var rail = $('rail');
  rail.innerHTML = VIEWS.map(function(x, idx){
    return '<button data-jump="'+idx+'" class="'+(idx===S.i?'on':'')+'">'+esc(x.nav)+'</button>';
  }).join('');

  /* 舞台 */
  var stage = $('stage');
  var mainEl = document.querySelector('main');
  if(v.kind === 'doc'){
    mainEl.classList.add('doc-mode');
    stage.innerHTML = '<div class="doc fade">'
      + '<h2 class="serif">'+esc(v.title)+'</h2>'
      + '<p class="lede">'+esc(v.lede)+'</p>'
      + v.body()
      + '</div>';
  } else {
    mainEl.classList.remove('doc-mode');
    /* 除第一幕（故意的待机态）外，设备都是开着的 */
    if(v.id !== 'arrive') S.on = true;
    stage.innerHTML = '<div class="device fade">'
      + '<div class="plate"><span>院内智慧陪诊终端</span><span class="live"><span class="dot'+(S.on?'':' off')+'"></span>'+(S.on?'运行中':'待机')+'</span></div>'
      + deviceFor()
      + '</div>'
      + '<div class="stage-note">点设备上的按钮可以直接往下走</div>';
  }

  /* 解说 */
  $('aside').innerHTML = v.kind === 'doc' ? '' : (narrFor() + phoneFor());

  /* 底栏 */
  var stepViews = VIEWS.filter(function(x){ return !x.kind; });
  var cur = stepViews.indexOf(v);
  $('pos').innerHTML = cur >= 0
    ? '第 <b>'+(cur+1)+'</b> / '+stepViews.length+' 步'
    : '<b>附录</b> · '+esc(v.nav);
  $('prev').disabled = S.i === 0;
  $('next').disabled = S.i === VIEWS.length - 1;
  $('next').textContent = S.i === VIEWS.length - 1 ? '演示结束' : '下一步 →';
}

/* =========================================================
   交互
   ========================================================= */
function go(i, keepHash){
  S.i = Math.max(0, Math.min(VIEWS.length-1, i));
  S.sos = false;
  S.comfort = '';
  if(!keepHash){ try{ history.replaceState(null,'','#'+(S.i+1)); }catch(err){} }
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-jump],[data-act]');
  if(!t) return;

  if(t.dataset.jump !== undefined){ go(+t.dataset.jump); return; }

  var a = t.dataset.act;
  switch(a){
    case 'on': S.on = true; break;
    case 'id': S.on = true; break;
    case 'face': S.on = true; break;
    case 'symptom': break;
    case 'sos': S.sos = true; break;
    case 'sosOff': S.sos = false; break;
    case 'spotIm': S.spot = 'im'; S.comfort = '第一次来这么大的医院，是容易转晕。跟着我走，一步一步来。'; break;
    case 'spotPharm': S.spot = 'pharm'; break;
    case 'reset': S.on = false; S.spot = 'hall'; break;
    case 'none': return;
    case 'next': go(S.i + 1); return;
    default: return;
  }
  render();
});

$('prev').addEventListener('click', function(){ go(S.i-1); });
$('next').addEventListener('click', function(){ go(S.i+1); });

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(S.i+1); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); go(S.i-1); }
  if(e.key === 'Home'){ e.preventDefault(); go(0); }
});

/* 支持 #3 这种深链直接跳到第 3 幕，方便评审时单独发一幕给医院看 */
var deep = parseInt((location.hash||'').replace('#',''), 10);
if(deep >= 1 && deep <= VIEWS.length) S.i = deep - 1;

render();
})();
</script>
